<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Q popup preview</title>
<link rel="stylesheet" href="../tango.css">
<link rel="stylesheet" href="../popup.css">
</head>
<body class="tg">
  <script src="chrome-shim.js"></script>
  <script src="../config.js"></script>
  <script>
    // Render the real popup's markup, then run the real popup script against the stand-in storage.
    fetch("../popup.html").then((r) => r.text()).then((html) => {
      const doc = new DOMParser().parseFromString(html, "text/html");
      doc.querySelectorAll("script").forEach((s) => s.remove());
      document.body.insertAdjacentHTML("afterbegin", doc.body.innerHTML);
      const s = document.createElement("script");
      s.src = "../popup.js";
      document.body.appendChild(s);
    });
  </script>
</body>
</html>
